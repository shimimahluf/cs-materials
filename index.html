000000002, "y": 3.84, "w": 1.2, "h": 0.42, "fill": "F2F3F7", "line": "2A3363", "lw": 1, "arrow": false}, {"k": "text", "text": "1", "x": 9.683000000000002, "y": 3.84, "w": 1.2, "h": 0.42, "align": "center", "valign": "middle", "ltr": true, "font": "Courier New", "size": 16, "bold": true, "color": "2A3363"}, {"k": "shape", "type": "rect", "x": 9.683000000000002, "y": 3.34, "w": 1.2, "h": 0.42, "fill": "F2F3F7", "line": "2A3363", "lw": 1, "arrow": false}, {"k": "text", "text": "7", "x": 9.683000000000002, "y": 3.34, "w": 1.2, "h": 0.42, "align": "center", "valign": "middle", "ltr": true, "font": "Courier New", "size": 16, "bold": true, "color": "2A3363"}, {"k": "shape", "type": "rect", "x": 9.683000000000002, "y": 2.84, "w": 1.2, "h": 0.42, "fill": "F2F3F7", "line": "2A3363", "lw": 1, "arrow": false}, {"k": "text", "text": "4", "x": 9.683000000000002, "y": 2.84, "w": 1.2, "h": 0.42, "align": "center", "valign": "middle", "ltr": true, "font": "Courier New", "size": 16, "bold": true, "color": "2A3363"}, {"k": "text", "text": "`s`", "x": 8.983000000000002, "y": 4.42, "w": 2.5999999999999996, "h": 0.75, "align": "center", "valign": "top", "ltr": false, "size": 14, "color": "24262B"}, {"k": "shape", "type": "line", "x": 11.383000000000001, "y": 2.55, "w": 0, "h": 1.75, "line": "2A3363", "lw": 2, "arrow": false}, {"k": "shape", "type": "line", "x": 12.783000000000001, "y": 2.55, "w": 0, "h": 1.75, "line": "2A3363", "lw": 2, "arrow": false}, {"k": "shape", "type": "line", "x": 11.383000000000001, "y": 4.3, "w": 1.4, "h": 0, "line": "2A3363", "lw": 2, "arrow": false}, {"k": "text", "text": "ריקה", "x": 11.383000000000001, "y": 3.6999999999999997, "w": 1.4, "h": 0.5, "align": "center", "valign": "middle", "ltr": false, "size": 13, "color": "5B6478"}, {"k": "text", "text": "`temp`", "x": 10.783000000000001, "y": 4.42, "w": 2.5999999999999996, "h": 0.75, "align": "center", "valign": "top", "ltr": false, "size": 14, "color": "24262B"}, {"k": "text", "text": "מחזירים הכול:\nאותו סדר כמו בהתחלה", "x": 9.533000000000001, "y": 5.2, "w": 3.3, "h": 0.9, "align": "center", "valign": "top", "ltr": false, "size": 14, "color": "5B6478"}]}, {"type": "code", "section": "התבנית", "title": "Size — התבנית", "code": "static int Size(Stack<int> s)\n{\n    Stack<int> temp = new Stack<int>();\n    int count = 0;\n    while (!s.IsEmpty())\n    {\n        int x = s.Pop();\n        count++;              // do something with x\n        temp.Push(x);\n    }\n    while (!temp.IsEmpty())\n        s.Push(temp.Pop());   // restore\n    return count;\n}", "fontSize": 14, "codeW": 7.4, "points": ["לולאה 1: מוציאים ל-`x`, משתמשים בו, ומכניסים ל-`temp`.", "לולאה 2: מחזירים הכול מ-`temp` אל `s`.", "מפעולה לפעולה משתנה רק השורה שבאמצע."]}, {"type": "code", "section": "התבנית", "title": "Sum — אותה תבנית", "code": "static int Sum(Stack<int> s)\n{\n    Stack<int> temp = new Stack<int>();\n    int sum = 0;\n    while (!s.IsEmpty())\n    {\n        int x = s.Pop();\n        sum += x;\n        temp.Push(x);\n    }\n    while (!temp.IsEmpty())\n        s.Push(temp.Pop());\n    return sum;\n}", "fontSize": 14, "codeW": 7.4, "points": ["‏`count++` הפך ל-`sum += x` — וזה כל השינוי.", "תמיד שומרים קודם את האיבר במשתנה: ‏`Pop` אחד בכל סיבוב.", "אחרי הזימון המחסנית חוזרת להיות בדיוק כמו בהתחלה."]}, {"type": "code", "section": "התבנית", "title": "באג: יוצאים לפני שמחזירים", "code": "static bool ContainsBuggy(Stack<int> s, int x)\n{\n    Stack<int> temp = new Stack<int>();\n    while (!s.IsEmpty())\n    {\n        int y = s.Pop();\n        if (y == x)\n            return true;      // temp is lost!\n        temp.Push(y);\n    }\n    while (!temp.IsEmpty())\n        s.Push(temp.Pop());\n    return false;\n}", "fontSize": 14, "codeW": 7.4, "points": ["‏`return` בתוך לולאה 1 מדלג על לולאה 2, והאיברים שב-`temp` הולכים לאיבוד.", "במחסנית מהשקף הקודם, עבור x = 1 היא מחזירה True, אבל ב-s נשארים רק 7 ו-3.", "כלל: אין `return` לפני לולאת ההחזרה."]}, {"type": "code", "section": "התבנית", "title": "התיקון: דגל, ועצירה מוקדמת", "code": "static bool Contains(Stack<int> s, int x)\n{\n    Stack<int> temp = new Stack<int>();\n    bool found = false;\n    while (!s.IsEmpty() && !found)\n    {\n        int y = s.Pop();\n        if (y == x)\n            found = true;\n        temp.Push(y);\n    }\n    while (!temp.IsEmpty())\n        s.Push(temp.Pop());\n    return found;\n}", "fontSize": 14, "codeW": 7.4, "points": ["‏`found` זוכר את התשובה, והלולאה נעצרת ברגע שהוא true.", "בתנאי `!s.IsEmpty() && !found` שני החלקים חייבים להתקיים כדי להמשיך.", "ה-`return` נמצא אחרי ההחזרה, ולכן s שלמה שוב."]}, {"type": "code", "section": "שינוי ובנייה", "title": "Clone — בניית העתק", "code": "static Stack<int> Clone(Stack<int> s)\n{\n    Stack<int> temp = new Stack<int>();\n    Stack<int> copy = new Stack<int>();\n    while (!s.IsEmpty())\n        temp.Push(s.Pop());\n    while (!temp.IsEmpty())\n    {\n        int x = temp.Pop();\n        s.Push(x);\n        copy.Push(x);\n    }\n    return copy;\n}", "fontSize": 14, "codeW": 7.4, "points": ["לולאה 1 רק מעבירה את s ל-temp, בסדר הפוך.", "לולאה 2 מכניסה כל איבר ל**שתי** מחסניות: חזרה ל-s, וגם להעתק.", "בסוף שתיהן באותו סדר כמו המקורית."]}, {"type": "code", "section": "שינוי ובנייה", "title": "RemoveAll — שינוי בכוונה", "code": "static void RemoveAll(Stack<int> s, int x)\n{\n    Stack<int> temp = new Stack<int>();\n    while (!s.IsEmpty())\n    {\n        int y = s.Pop();\n        if (y != x)\n            temp.Push(y);     // keep only the others\n    }\n    while (!temp.IsEmpty())\n        s.Push(temp.Pop());\n}", "fontSize": 14, "codeW": 7.4, "points": ["אותה תבנית, אבל ל-temp נכנסים רק האיברים שנשארים.", "לולאת ההחזרה מחזירה את השאר, בסדר המקורי שלהם.", "בהעתק, הסרת 7 משאירה רק את 4, ‏1 ו-3, באותו סדר."]}, {"type": "table", "section": "שינוי ובנייה", "title": "שלושה סוגים של פעולות על מחסנית", "head": ["סוג", "מה חוזר ל-s", "דוגמאות"], "rows": [["רק קוראים", "כל האיברים, באותו סדר", "`Size`, `Sum`, `Contains`, `Max`"], ["משנים את s", "רק האיברים שנשארים, או ערכים חדשים", "`RemoveAll`, `ReplaceAll`"], ["בונים מחסנית חדשה", "כל האיברים; המחסנית החדשה מקבלת חלק מהם או את כולם", "`Clone`, `CopyEven`"]], "colW": [3, 5.1, 4.23], "rowH": 0.8, "fontSize": 16}, {"type": "cards", "section": "שינוי ובנייה", "title": "כמה זה מהיר?", "cols": 3, "items": [{"head": "שתי לולאות ברצף", "text": "‏n איברים יוצאים ו-n חוזרים: ‏2n צעדים, ולכן O(n)."}, {"head": "זיכרון נוסף", "text": "מחסנית העזר מחזיקה עד n איברים בזמן העבודה."}, {"head": "פעולה בתוך לולאה", "text": "זימון `Contains` לכל איבר: ‏n זימונים של O(n) כל אחד, ולכן O(n²) בסך הכול."}]}, {"type": "statement", "section": "שינוי ובנייה", "title": "מה הלאה", "icon": "→", "big": "אלגוריתמים קלאסיים על מחסנית.", "text": "היפוך מחסנית, הכנסה לתחתית, בדיקה אם היא ממוינת, ומעקב אחר פעולה מסתורית כמו במבחן."}, {"type": "cards", "section": "סיכום ותרגול", "title": "תרגול", "icon": "!", "cols": 2, "intro": "דף העבודה: 4 חלקים", "items": [{"head": "א — הבנה", "text": "נכון או לא נכון, עם נימוק."}, {"head": "ב — קריאה", "text": "שני באגים ופעולה מסתורית."}, {"head": "ג — כתיבה", "text": "עשר פעולות על מחסנית, עם Main נתון."}, {"head": "ד — אתגר", "text": "האם היא ממוינת? הכנסה למחסנית ממוינת."}], "cardH": 1.85}, {"type": "summary", "section": "סיכום ותרגול", "items": [{"head": "מחסנית עזר + החזרה", "text": "לולאה 1 מוציאה ועובדת; לולאה 2 מחזירה הכול."}, {"head": "‏Pop אחד בכל סיבוב", "text": "שומרים את האיבר במשתנה, ואין return לפני ההחזרה."}, {"head": "מחליטים מה הסוג", "text": "רק קריאה, שינוי, או בניית מחסנית חדשה — זה קובע מה חוזר."}]}, {"type": "custom", "section": "סיכום ותרגול", "title": "כרטיס יציאה", "items": [{"k": "badge", "x": 0.5, "y": 2, "w": 0.9, "h": 0.9, "label": "?", "color": "156DF2"}, {"k": "text", "text": "במחסנית s יש מהראש לתחתית 1, ‏5, ‏9. מזמנים את ContainsBuggy כדי לחפש את 5. מה מוחזר, ומה נשאר ב-s?", "x": 1.8, "y": 1.75, "w": 11.033, "h": 1.4, "valign": "middle", "ltr": false, "size": 24, "bold": true, "color": "2A3363"}, {"k": "text", "text": "ואז: איך מתקנים את הפעולה? במשפט אחד.", "x": 1.8, "y": 3.4, "w": 11.033, "h": 0.6, "valign": "middle", "ltr": false, "size": 18, "color": "24262B"}]}], "files": [{"kind": "summary.pdf", "href": "files/st2-summary.pdf", "name": "תקציר - מחסנית - מעבר בלי להרוס.pdf", "what": "תקציר השיעור"}]}], "bank": [{"id": "l1t1", "lesson": "co1", "kind": "trace", "q": "מה הפלט?", "code": "Passenger a = new Passenger(\"Shir\", \"101\", 14);\nPassenger b = a;\nPassenger c = new Passenger(\"Shir\", \"101\", 14);\nb.SetLuggageKg(30);\nConsole.WriteLine(a.GetLuggageKg());\nConsole.WriteLine(c.GetLuggageKg());\nConsole.WriteLine(a == c);", "wrong": ["14\n14\nTrue", "30\n30\nTrue", "30\n14\nTrue"], "why": "`b = a` מעתיק את החץ, ולכן השינוי דרך b נראה דרך a. ל-c יש עצם משלו. `==` משווה חצים, ולכן a == c הוא False.", "answer": "30\n14\nFalse"}, {"id": "l1t2", "lesson": "co1", "kind": "trace", "q": "מה הפלט?", "code": "Passenger p = new Passenger(\"Eden\", \"202\", 10);\np.SetLuggageKg(-3);\np.SetLuggageKg(p.GetLuggageKg() * 2);\nConsole.WriteLine(p);", "wrong": ["Eden (202), luggage: -3 kg", "Eden (202), luggage: -6 kg", "Eden (202), luggage: 10 kg"], "why": "SetLuggageKg מתעלמת מערך שלילי, ולכן המשקל נשאר 10. אחר כך הוא מוכפל ל-20. `Console.WriteLine(p)` קוראת ל-ToString.", "answer": "Eden (202), luggage: 20 kg"}, {"id": "l1t3", "lesson": "co1", "kind": "trace", "q": "מה הפלט?", "code": "static void Swap(Passenger x, Passenger y)\n{\n    Passenger temp = x;\n    x = y;\n    y = temp;\n}\n\n// Main:\nPassenger a = new Passenger(\"Roni\", \"1\", 5);\nPassenger b = new Passenger(\"Gil\", \"2\", 7);\nSwap(a, b);\nConsole.WriteLine(a.GetName() + \" \" + b.GetName());", "wrong": ["Gil Roni", "Roni Roni", "Gil Gil"], "why": "הפרמטרים x ו-y מקבלים עותקים של החצים. ההחלפה מזיזה רק את העותקים בתוך הפעולה, ולכן a ו-b לא השתנו.", "answer": "Roni Gil"}, {"id": "l1f1", "lesson": "co1", "kind": "tf", "q": "לכל עצם מטיפוס Passenger יש עותק משלו של התכונות name, ‏id ו-luggageKg.", "answer": true, "why": "כל `new` בונה עצם חדש עם קבוצת תכונות משלו."}, {"id": "l1f2", "lesson": "co1", "kind": "tf", "q": "אחרי `Passenger y = x;` ו-`y = null;` העצם ש-x מצביע אליו נמחק.", "answer": false, "why": "השמת null ב-y משנה רק את y. x עדיין מצביע לאותו עצם."}, {"id": "l1f3", "lesson": "co1", "kind": "tf", "q": "`c1.IsSamePerson(c2)` יכול להחזיר True גם כש-`c1 == c2` מחזיר False.", "answer": true, "why": "IsSamePerson משווה תוכן (תעודת זהות), ו-`==` משווה חצים. שני עצמים נפרדים עם אותה ת\"ז: True ו-False."}, {"id": "l1f4", "lesson": "co1", "kind": "tf", "q": "בפעולה בונה, הכתיבה `name = name;` שומרת את הפרמטר בתכונה.", "answer": false, "why": "בלי `this.` שני הצדדים הם הפרמטר, והתכונה נשארת ריקה. צריך `this.name = name;`."}, {"id": "l1b1", "lesson": "co1", "kind": "bug", "q": "מה יקרה כשמריצים את הקוד? הסבירו.", "code": "Passenger p = null;\nif (p.GetLuggageKg() > 20)\n    Console.WriteLine(\"Heavy\");", "answer": "התוכנית תיעצר עם NullReferenceException: p לא מצביע לאף עצם, ואי אפשר לקרוא דרכו לפעולה. צריך לבדוק קודם `p != null`."}, {"id": "l1b2", "lesson": "co1", "kind": "bug", "q": "למה הקוד לא עובר קומפילציה?", "code": "Passenger p = new Passenger(\"Dana\", \"203\", 18);\np.luggageKg = 25;", "answer": "luggageKg היא תכונה private, ואי אפשר לגשת אליה מחוץ למחלקה. משתמשים ב-`p.SetLuggageKg(25);`."}, {"id": "l2t1", "lesson": "co2", "kind": "trace", "q": "מה הפלט?", "code": "Passenger[] seats = new Passenger[5];\nseats[1] = new Passenger(\"Ido\", \"11\", 8);\nseats[3] = seats[1];\nint count = 0;\nfor (int i = 0; i < seats.Length; i++)\n    if (seats[i] == null)\n        count++;\nConsole.WriteLine(count);", "wrong": ["4", "2", "5"], "why": "יש עצם אחד, אבל שני תאים מצביעים אליו (1 ו-3). שלושה תאים נשארו null.", "answer": "3"}, {"id": "l2t2", "lesson": "co2", "kind": "trace", "q": "מה הפלט?", "code": "Passenger[] seats = new Passenger[3];\nseats[0] = new Passenger(\"Lia\", \"21\", 10);\nseats[2] = seats[0];\nseats[2].SetLuggageKg(16);\nseats[0] = new Passenger(\"Ben\", \"22\", 4);\nConsole.WriteLine(seats[0].GetLuggageKg() + \" \" + seats[2].GetLuggageKg());", "wrong": ["16 16", "4 4", "10 16"], "why": "seats[2] מצביע ללִיה, שהמשקל שלה שונה ל-16. אחר כך seats[0] מקבל עצם חדש (בן, 4), ו-seats[2] עדיין מצביע לליה.", "answer": "4 16"}, {"id": "l2t3", "lesson": "co2", "kind": "trace", "q": "מה הפלט?", "code": "static int Mystery(Passenger[] seats, int limit)\n{\n    int r = 0;\n    for (int i = 0; i < seats.Length; i++)\n        if (seats[i] != null && seats[i].GetLuggageKg() > limit)\n            r += seats[i].GetLuggageKg();\n    return r;\n}\n\n// Main:\nPassenger[] s = new Passenger[4];\ns[0] = new Passenger(\"A\", \"1\", 12);\ns[1] = new Passenger(\"B\", \"2\", 25);\ns[3] = new Passenger(\"C\", \"3\", 20);\nConsole.WriteLine(Mystery(s, 15));", "wrong": ["57", "2", "25"], "why": "הפעולה מסכמת את המשקל של נוסעים שיש להם יותר מ-15 ק\"ג: 25 + 20 = 45. התא הריק מדולג בזכות הבדיקה `!= null`.", "answer": "45"}, {"id": "l2f1", "lesson": "co2", "kind": "tf", "q": "`new Passenger[10]` בונה 10 עצמים מטיפוס Passenger.", "answer": false, "why": "הוא בונה מערך אחד של 10 תאים, וכל התאים null. עצמים נבנים רק עם `new Passenger(...)`."}, {"id": "l2f2", "lesson": "co2", "kind": "tf", "q": "פעולה שמקבלת `Passenger[]` ומשנה תא בו משנה את המערך המקורי.", "answer": true, "why": "הפרמטר מקבל עותק של החץ למערך, ולכן הוא מצביע לאותו מערך."}, {"id": "l2f3", "lesson": "co2", "kind": "tf", "q": "בתנאי `seats[i].GetId() == id && seats[i] != null` הבדיקה מגינה מקריסה.", "answer": false, "why": "הסדר חשוב: קודם בודקים `!= null`. כאן קוראים ל-GetId לפני הבדיקה, ובתא ריק התוכנית תקרוס."}, {"id": "l2f4", "lesson": "co2", "kind": "tf", "q": "פעולת חיפוש שלא מצאה נוסע יכולה להחזיר null.", "answer": true, "why": "null הוא ערך חוקי לכל טיפוס מחלקה, ומי שקורא לפעולה בודק אותו."}, {"id": "l2b1", "lesson": "co2", "kind": "bug", "q": "הפעולה אמורה להחזיר את הנוסע הקל ביותר. מה הבאג?", "code": "static Passenger Lightest(Passenger[] seats)\n{\n    Passenger best = seats[0];\n    for (int i = 1; i < seats.Length; i++)\n        if (seats[i] != null && seats[i].GetLuggageKg() < best.GetLuggageKg())\n            best = seats[i];\n    return best;\n}", "answer": "אם seats[0] ריק, best הוא null והקריאה `best.GetLuggageKg()` תקרוס. מתחילים עם `best = null` ובודקים `best == null ||` לפני ההשוואה."}, {"id": "l2b2", "lesson": "co2", "kind": "bug", "q": "מה הבעיה בקוד?", "code": "Passenger[] seats = new Passenger[4];\nfor (int i = 0; i <= seats.Length; i++)\n    seats[i] = new Passenger(\"Guest\", \"\" + i, 0);", "answer": "התנאי `<=` מגיע לאינדקס 4, שלא קיים במערך בגודל 4: IndexOutOfRangeException. צריך `i < seats.Length`."}, {"id": "l3t1", "lesson": "co3", "kind": "trace", "q": "מה הפלט?", "code": "Pilot gal = new Pilot(\"Gal\", \"IL-1\", 990);\nFlight f1 = new Flight(\"LY1\", \"Rome\", gal, 3);\nFlight f2 = new Flight(\"LY2\", \"Paris\", gal, 3);\nf1.GetPilot().AddFlightHours(15);\nConsole.WriteLine(f2.GetPilot().IsSenior());", "wrong": ["False", "1005", "990"], "why": "שתי הטיסות מצביעות לאותו טייס. אחרי ההוספה יש לגל 1005 שעות, ולכן IsSenior מחזירה True גם דרך f2.", "answer": "True"}, {"id": "l3t2", "lesson": "co3", "kind": "trace", "q": "מה הפלט?", "code": "Flight f = new Flight(\"LY3\", \"Athens\", new Pilot(\"Noa\", \"IL-2\", 500), 3);\nPassenger p = new Passenger(\"Tal\", \"5\", 9);\nConsole.WriteLine(f.Book(1, p));\nConsole.WriteLine(f.Book(1, new Passenger(\"Avi\", \"6\", 3)));\nConsole.WriteLine(f.Book(3, p));\nConsole.WriteLine(f.CountFree());", "wrong": ["True\nTrue\nTrue\n0", "True\nFalse\nTrue\n1", "True\nFalse\nFalse\n1"], "why": "מושב 1 פנוי: True. מושב 1 כבר תפוס: False. מושב 3 לא קיים במערך בגודל 3: False. נשארו 2 מושבים פנויים.", "answer": "True\nFalse\nFalse\n2"}, {"id": "l3t3", "lesson": "co3", "kind": "trace", "q": "מה הפלט?", "code": "Pilot a = new Pilot(\"Dor\", \"IL-3\", 1200);\nPilot b = new Pilot(\"Yam\", \"IL-4\", 300);\nFlight f = new Flight(\"LY4\", \"Eilat\", a, 2);\nPilot keep = f.GetPilot();\nf.SetPilot(b);\nkeep.AddFlightHours(10);\nConsole.WriteLine(f.GetPilot().GetName() + \" \" + keep.GetFlightHours());", "wrong": ["Dor 1210", "Yam 310", "Dor 1200"], "why": "keep שמר חץ לדור. SetPilot מחליפה את החץ שבתוך הטיסה ליָם, אבל keep עדיין מצביע לדור, שעכשיו יש לו 1210 שעות.", "answer": "Yam 1210"}, {"id": "l3f1", "lesson": "co3", "kind": "tf", "q": "Flight היא מחלקה מורכבת, כי יש לה תכונה מטיפוס של מחלקה אחרת.", "answer": true, "why": "לטיסה יש תכונה מטיפוס Pilot ותכונה מטיפוס `Passenger[]`."}, {"id": "l3f2", "lesson": "co3", "kind": "tf", "q": "כשבונים Flight, נבנה אוטומטית גם עצם Pilot חדש.", "answer": false, "why": "הטייס מגיע מבחוץ כפרמטר. הטיסה רק שומרת חץ אליו."}, {"id": "l3f3", "lesson": "co3", "kind": "tf", "q": "בהעתקה שטוחה של Flight, הזמנה בעותק משנה גם את הטיסה המקורית.", "answer": true, "why": "`this.seats = other.seats` מעתיק את החץ, ולכן שתי הטיסות חולקות מערך אחד."}, {"id": "l3f4", "lesson": "co3", "kind": "tf", "q": "פעולה בונה מעתיקה שבונה מערך חדש ומעתיקה אליו את התאים יוצרת גם נוסעים חדשים.", "answer": false, "why": "המערך חדש, אבל התאים מצביעים לאותם נוסעים. כדי ליצור גם נוסעים חדשים צריך העתקה עמוקה (deep copy)."}, {"id": "l3b1", "lesson": "co3", "kind": "bug", "q": "הפעולה הבונה של Flight נכתבה כך. מה יקרה כשנקרא ל-Book?", "code": "public Flight(string number, string destination, Pilot pilot, int numSeats)\n{\n    this.number = number;\n    this.destination = destination;\n    this.pilot = pilot;\n}", "answer": "המערך seats אף פעם לא נבנה, ולכן הוא null. כל גישה ל-`seats.Length` או ל-`seats[seat]` תקרוס עם NullReferenceException. חסרה השורה `this.seats = new Passenger[numSeats];`."}, {"id": "l3b2", "lesson": "co3", "kind": "bug", "q": "למה הקוד ב-Main לא עובר קומפילציה?", "code": "Flight f = new Flight(\"LY5\", \"Rome\", new Pilot(\"Gal\", \"IL-1\", 1030), 4);\nf.seats[0] = new Passenger(\"Dana\", \"203\", 18);", "answer": "seats היא תכונה private של Flight. מבחוץ מזמינים מושב רק דרך הפעולה `f.Book(0, ...)`."}, {"id": "tc1t1", "lesson": "tc1", "kind": "trace", "q": "מה הפלט?", "code": "static long steps = 0;\n\nstatic void AllPairs(int[] arr)\n{\n    for (int i = 0; i < arr.Length; i++)\n        for (int j = i + 1; j < arr.Length; j++)\n            steps++;\n}\n\n// Main:\nAllPairs(new int[5]);\nConsole.WriteLine(steps);", "wrong": ["25", "20", "5"], "why": "עבור `i = 0` יש 4 סיבובים פנימיים, ואחר כך 3, 2, 1, 0. סך הכול `4 + 3 + 2 + 1 = 10`, כלומר `n(n−1)/2` עבור n = 5.", "answer": "10"}, {"id": "tc1t2", "lesson": "tc1", "kind": "trace", "q": "מה הפלט?", "code": "static long steps = 0;\n\nstatic int IndexOf(int[] arr, int x)\n{\n    for (int i = 0; i < arr.Length; i++)\n    {\n        steps++;\n        if (arr[i] == x)\n            return i;\n    }\n    return -1;\n}\n\n// Main:\nint[] arr = { 4, 8, 15, 16, 23, 42 };\nIndexOf(arr, 15);\nConsole.Write(steps + \" \");\nsteps = 0;\nIndexOf(arr, 7);\nConsole.WriteLine(steps);", "wrong": ["3 3", "2 6", "6 6"], "why": "15 נמצא בתא השלישי: 3 צעדים. 7 לא נמצא בכלל, ולכן הלולאה עוברת על כל 6 התאים: זה המקרה הגרוע.", "answer": "3 6"}, {"id": "tc1m1", "lesson": "tc1", "kind": "mc", "q": "הפעולה `Sum` עוברת פעם אחת על המערך. n גדל מ-1,000 ל-5,000. פי כמה יגדל מספר הצעדים?", "options": ["פי 5", "פי 25", "פי 10", "בערך אותו דבר"], "answer": "פי 5", "why": "ב-`Sum` יש צעד אחד לכל תא, n צעדים. כש-n גדל פי 5, גם הצעדים גדלים פי 5."}, {"id": "tc1m2", "lesson": "tc1", "kind": "mc", "q": "הפעולה `CountPairs` עושה בערך `n²/2` צעדים. n גדל פי 10. פי כמה יגדל מספר הצעדים?", "options": ["פי 100", "פי 10", "פי 20", "פי 50"], "answer": "פי 100", "why": "`(10n)²/2 = 100 · n²/2`. כש-n גדל פי 10, הריבוע גדל פי 100."}, {"id": "tc1f1", "lesson": "tc1", "kind": "tf", "q": "תוכנית שרצה 2 שניות במחשב שלי תרוץ 2 שניות בכל מחשב.", "answer": false, "why": "הזמן תלוי במעבד, בתוכניות אחרות שרצות ובעוד הרבה דברים. לכן סופרים צעדים ולא שניות."}, {"id": "tc1f2", "lesson": "tc1", "kind": "tf", "q": "כשמספר הצעדים גדל כמו `n²`, הכפלת n מגדילה את מספר הצעדים בערך פי 4.", "answer": true, "why": "`(2n)² = 4n²`. זה ה\"פי 4\" שראינו גם בשעון העצר וגם במונה הצעדים."}, {"id": "tc1f3", "lesson": "tc1", "kind": "tf", "q": "המקרה הגרוע של `IndexOf` הוא כש-x נמצא בתא הראשון.", "answer": false, "why": "זה המקרה הטוב: צעד אחד. המקרה הגרוע הוא כש-x לא נמצא בכלל, ואז עוברים על כל n התאים."}, {"id": "tc1f4", "lesson": "tc1", "kind": "tf", "q": "שתי פעולות נכונות לאותה בעיה יכולות להיות שונות מאוד בזמן הריצה כשהקלט גדול.", "answer": true, "why": "שתי הפעולות לבדיקת כפילויות נכונות, אבל האיטית עושה בערך `n²/2` צעדים והמהירה רק n."}, {"id": "tc2m1", "lesson": "tc2", "kind": "mc", "q": "מה הסיבוכיות?", "code": "for (int i = 0; i < arr.Length; i++)\n    for (int j = 0; j < arr.Length; j++)\n        for (int k = 0; k < 5; k++)\n            count++;", "options": ["O(n²)", "O(n³)", "O(5n²)", "O(n)"], "answer": "O(n²)", "why": "שתי הלולאות החיצוניות רצות על המערך, והפנימית רצה 5 פעמים בלבד. `5n²` צעדים, ומשמיטים את הקבוע: O(n²)."}, {"id": "tc2m2", "lesson": "tc2", "kind": "mc", "q": "מה הסיבוכיות?", "code": "int count = 0;\nfor (int i = 1; i < n; i = i * 2)\n    count++;", "options": ["O(log n)", "O(n)", "O(n/2)", "O(1)"], "answer": "O(log n)", "why": "i מוכפל בכל סיבוב: 1, 2, 4, 8... מגיעים ל-n אחרי בערך `log₂ n` סיבובים. זו חצייה הפוכה."}, {"id": "tc2m3", "lesson": "tc2", "kind": "mc", "q": "מה הסיבוכיות?", "code": "for (int i = 0; i < arr.Length; i++)\n    sum += arr[i];\n\nfor (int i = 0; i < 10; i++)\n    for (int j = 0; j < 10; j++)\n        grid += i * j;", "options": ["O(n)", "O(n²)", "O(n + 100)", "O(1)"], "answer": "O(n)", "why": "החלק הראשון O(n). החלק השני רץ 100 פעמים בכל מקרה: O(1). ברצף, החלק הגדול קובע: O(n)."}, {"id": "tc2m4", "lesson": "tc2", "kind": "mc", "q": "מה הסיבוכיות?", "code": "for (int i = 0; i < arr.Length; i++)\n    for (int j = i; j < arr.Length; j++)\n        if (arr[i] + arr[j] == 10)\n            count++;", "options": ["O(n²)", "O(n)", "O(n log n)", "O(n²/2)"], "answer": "O(n²)", "why": "הלולאה הפנימית מתחילה מ-i, ולכן עוברת על בערך חצי מהזוגות: `n²/2` צעדים. משמיטים את החצי: O(n²)."}, {"id": "tc2m5", "lesson": "tc2", "kind": "mc", "q": "מספר הצעדים של אלגוריתם הוא `5n² + 3n + 100`. מה הסיבוכיות?", "options": ["O(n²)", "O(5n²)", "O(n² + n)", "O(100)"], "answer": "O(n²)", "why": "משאירים רק את האיבר שגדל הכי מהר, `5n²`, ומשמיטים את הקבוע 5."}, {"id": "tc2t1", "lesson": "tc2", "kind": "trace", "q": "מה הפלט?", "code": "int k = 100;\nint steps = 0;\nwhile (k > 1)\n{\n    k = k / 2;\n    steps++;\n}\nConsole.WriteLine(steps);", "wrong": ["50", "7", "10"], "why": "100, 50, 25, 12, 6, 3, 1: שישה סיבובים. זה בערך `log₂ 100`, ולכן החצייה היא O(log n).", "answer": "6"}, {"id": "tc2f1", "lesson": "tc2", "kind": "tf", "q": "`O(n/2)` היא סיבוכיות שונה מ-`O(n)`.", "answer": false, "why": "החצי הוא קבוע, ומשמיטים אותו. שתיהן O(n)."}, {"id": "tc2f2", "lesson": "tc2", "kind": "tf", "q": "לולאה שרצה תמיד 100 פעמים, בלי קשר לגודל המערך, היא O(1).", "answer": true, "why": "מספר הסיבובים לא תלוי ב-n, ולכן הסיבוכיות קבועה."}, {"id": "tc2f3", "lesson": "tc2", "kind": "tf", "q": "שני קטעי קוד ברצף, אחד O(n) והשני O(n²), נותנים יחד O(n³).", "answer": false, "why": "קוד ברצף מחברים, לא כופלים: `O(n) + O(n²) = O(n²)`. כופלים רק כשלולאה נמצאת בתוך לולאה."}, {"id": "st1t1", "lesson": "st1", "kind": "trace", "q": "מה הפלט?", "code": "Stack<int> s = new Stack<int>();\ns.Push(3);\ns.Push(7);\ns.Push(1);\ns.Pop();\ns.Push(4);\nConsole.WriteLine(s.Top());\nConsole.WriteLine(s.Pop() + s.Pop());\nConsole.WriteLine(s.Top());", "wrong": ["4\n8\n3", "1\n11\n3", "4\n11\n7"], "why": "אחרי `Pop` ו-`Push(4)` המחסנית היא (top) 4, 7, 3. ‏`Top` מחזירה 4 בלי להוציא. אחר כך `4 + 7 = 11`, ונשאר רק 3.", "answer": "4\n11\n3"}, {"id": "st1t2", "lesson": "st1", "kind": "trace", "q": "מה הפלט?", "code": "Stack<int> a = new Stack<int>();\nStack<int> b = new Stack<int>();\na.Push(10);\na.Push(20);\na.Push(30);\nwhile (!a.IsEmpty())\n    b.Push(a.Pop());\nConsole.WriteLine(b.Top());\nConsole.WriteLine(a.IsEmpty());", "wrong": ["30\nTrue", "10\nFalse", "30\nFalse"], "why": "30 יצא מ-a ראשון ונכנס לתחתית של b. האחרון שעבר הוא 10, ולכן הוא בראש של b. ‏a התרוקנה.", "answer": "10\nTrue"}, {"id": "st1t3", "lesson": "st1", "kind": "trace", "q": "מה הפלט?", "code": "Stack<string> s = new Stack<string>();\ns.Push(\"red\");\ns.Push(\"green\");\nConsole.WriteLine(s.Top());\ns.Push(\"blue\");\nConsole.WriteLine(s.Top());\ns.Pop();\nConsole.WriteLine(s.Top());", "wrong": ["green\nblue\nblue", "red\nblue\ngreen", "green\nblue\nred"], "why": "‏`Top` רק מסתכלת. אחרי `Push(\"blue\")` הוא בראש, ואחרי `Pop` הוא יוצא ו-green חוזר להיות בראש.", "answer": "green\nblue\ngreen"}, {"id": "st1f1", "lesson": "st1", "kind": "tf", "q": "`Top` מוציאה את האיבר שבראש המחסנית.", "answer": false, "why": "‏`Top` רק מחזירה את האיבר שבראש. ‏`Pop` מחזירה ומוציאה."}, {"id": "st1f2", "lesson": "st1", "kind": "tf", "q": "`Push` ו-`Pop` הן O(1), לא משנה כמה איברים יש במחסנית.", "answer": true, "why": "שתיהן עובדות רק על הראש, ולכן גודל המחסנית לא משנה."}, {"id": "st1f3", "lesson": "st1", "kind": "tf", "q": "כדי לקרוא את האיבר שבתחתית מחסנית עם n איברים, צריך קודם להוציא n − 1 איברים.", "answer": true, "why": "רואים רק את הראש. לכן הגעה לתחתית היא O(n), בשונה מ-`arr[0]` במערך."}, {"id": "st1f4", "lesson": "st1", "kind": "tf", "q": "אחרי לולאה שמדפיסה את כל האיברים בעזרת `Pop`, המחסנית נשארת כמו שהייתה.", "answer": false, "why": "כל `Pop` מוציא איבר. בסוף הלולאה המחסנית ריקה, וכדי לשמור עליה צריך מחסנית עזר."}, {"id": "st1b1", "lesson": "st1", "kind": "bug", "q": "מה יקרה כשמריצים את הקוד?", "code": "Stack<int> s = new Stack<int>();\ns.Push(2);\nConsole.WriteLine(s.Pop() + s.Pop());", "answer": "יש במחסנית איבר אחד בלבד. ה-`Pop` השני נעשה על מחסנית ריקה, וזו שגיאה שעוצרת את התוכנית. לפני כל `Pop` בודקים `!s.IsEmpty()`."}, {"id": "st1b2", "lesson": "st1", "kind": "bug", "q": "הלולאה אמורה להוציא איברים עד שמגיעים ל-0. מה הבעיה?", "code": "while (s.Top() != 0)\n    s.Pop();", "answer": "אם אין 0 במחסנית, היא מתרוקנת ואז `Top` נקראת על מחסנית ריקה, והתוכנית נעצרת. התנאי צריך להיות `!s.IsEmpty() && s.Top() != 0`, והבדיקה של ריקות באה ראשונה."}, {"id": "st2t1", "lesson": "st2", "kind": "trace", "q": "הפעולה `Size` היא זו מהשיעור (מחסנית עזר והחזרה). מה הפלט?", "code": "static int Size(Stack<int> s)\n{\n    Stack<int> temp = new Stack<int>();\n    int count = 0;\n    while (!s.IsEmpty())\n    {\n        int x = s.Pop();\n        count++;\n        temp.Push(x);\n    }\n    while (!temp.IsEmpty())\n        s.Push(temp.Pop());\n    return count;\n}\n\n// Main:\nStack<int> s = new Stack<int>();\ns.Push(4);\ns.Push(9);\ns.Push(2);\nConsole.WriteLine(Size(s));\nConsole.WriteLine(s.Top());", "wrong": ["3\n4", "0\n2", "3\n9"], "why": "‏`Size` סופרת 3 איברים ומחזירה אותם ל-s באותו סדר. לכן 2 עדיין בראש.", "answer": "3\n2"}, {"id": "st2t2", "lesson": "st2", "kind": "trace", "q": "`ContainsBuggy` היא הפעולה מהשיעור, עם `return` בתוך הלולאה הראשונה. מה הפלט?", "code": "static bool ContainsBuggy(Stack<int> s, int x)\n{\n    Stack<int> temp = new Stack<int>();\n    while (!s.IsEmpty())\n    {\n        int y = s.Pop();\n        if (y == x)\n            return true;\n        temp.Push(y);\n    }\n    while (!temp.IsEmpty())\n        s.Push(temp.Pop());\n    return false;\n}\n\n// Main:\nStack<int> s = new Stack<int>();\ns.Push(6);\ns.Push(2);\ns.Push(8);\nConsole.WriteLine(ContainsBuggy(s, 2));\nConsole.WriteLine(s.Top());", "wrong": ["True\n8", "True\n2", "False\n8"], "why": "8 יוצא ל-temp, ואז 2 נמצא והפעולה חוזרת מיד. ‏8 נשאר ב-temp ונעלם, ו-2 כבר הוצא. ב-s נשאר רק 6.", "answer": "True\n6"}, {"id": "st2t3", "lesson": "st2", "kind": "trace", "q": "מה הפלט?", "code": "static void RemoveAll(Stack<int> s, int x)\n{\n    Stack<int> temp = new Stack<int>();\n    while (!s.IsEmpty())\n    {\n        int y = s.Pop();\n        if (y != x)\n            temp.Push(y);\n    }\n    while (!temp.IsEmpty())\n        s.Push(temp.Pop());\n}\n\n// Main:\nStack<int> s = new Stack<int>();\ns.Push(5);\ns.Push(1);\ns.Push(5);\ns.Push(3);\nRemoveAll(s, 5);\nwhile (!s.IsEmpty())\n    Console.WriteLine(s.Pop());", "wrong": ["1\n3", "3\n5\n1", "3\n1\n5"], "why": "ל-temp נכנסים רק 3 ו-1. ההחזרה מחזירה אותם בסדר המקורי, ולכן 3 שוב בראש ו-1 מתחתיו.", "answer": "3\n1"}, {"id": "st2f1", "lesson": "st2", "kind": "tf", "q": "בפעולה שרק קוראת את המחסנית, בסיום צריכים לחזור אליה כל האיברים, באותו סדר.", "answer": true, "why": "זו הדרישה הקבועה בבחינה, ובשבילה יש לולאת החזרה."}, {"id": "st2f2", "lesson": "st2", "kind": "tf", "q": "`Clone` מחזירה העתק, ומשאירה את המחסנית המקורית ריקה.", "answer": false, "why": "בלולאה השנייה כל איבר נכנס גם ל-s וגם להעתק. בסוף שתיהן מלאות ובאותו סדר."}, {"id": "st2f3", "lesson": "st2", "kind": "tf", "q": "`Size` עם מחסנית עזר היא O(n).", "answer": true, "why": "שתי לולאות ברצף: n איברים יוצאים ו-n חוזרים. ‏`2n` צעדים, כלומר O(n)."}, {"id": "st2f4", "lesson": "st2", "kind": "tf", "q": "זימון `Contains` עבור כל איבר במחסנית הוא O(n) בסך הכול.", "answer": false, "why": "יש n זימונים, וכל אחד הוא O(n). יחד זה O(n²)."}, {"id": "st2b1", "lesson": "st2", "kind": "bug", "q": "הפעולה מחזירה את הסכום הנכון. מה הבעיה בה?", "code": "static int Sum(Stack<int> s)\n{\n    int sum = 0;\n    while (!s.IsEmpty())\n        sum += s.Pop();\n    return sum;\n}", "answer": "היא מרוקנת את s. אחרי הזימון המחסנית ריקה, ומי שקרא לפעולה איבד אותה. צריך להכניס כל איבר למחסנית עזר ולהחזיר הכול בסוף."}, {"id": "st2b2", "lesson": "st2", "kind": "bug", "q": "מה הבעיה בלולאה הראשונה?", "code": "while (!s.IsEmpty())\n{\n    if (s.Pop() == x)\n        found = true;\n    temp.Push(s.Pop());\n}", "answer": "יש שני `Pop` בכל סיבוב, ולכן כל איבר שני נבדק ואחר כך הולך לאיבוד. במספר איברים אי-זוגי ה-`Pop` השני נעשה על מחסנית ריקה. שומרים קודם את האיבר במשתנה: `int y = s.Pop();`."}], "static": true, "siteUrl": "https://shimimahluf.github.io/cs-materials/"};

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\bO\([^)]*\)/g, m => `<bdi dir="ltr">${m}</bdi>`).replace(/\n/g, "<br>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const plain = s => String(s).replace(/\*\*|`/g, "");

// ---------- C# highlighting ----------
const KW = new Set("class public private protected static void int string bool double char new return if else for foreach while do true false null this override using break continue".split(" "));
const TY = new Set("Passenger Pilot Flight Console Member Library Math Stack Queue".split(" "));
function hl(code) {
  return String(code).replace(/(\/\/.*$)|("(?:[^"\\]|\\.)*")|([A-Za-z_]\w*)|([^\/"A-Za-z_]+|\/)/gm, (m, c, s, w, o, at, all) => {
    if (w && all[at - 1] === ".") return w;
    if (c) return `<span class="c">${esc(c)}</span>`;
    if (s) return `<span class="s">${esc(s)}</span>`;
    if (w) return KW.has(w) ? `<span class="k">${w}</span>` : TY.has(w) ? `<span class="t">${w}</span>` : w;
    return esc(o);
  });
}
const codeCard = code => `<div class="codecard"><div class="chrome" aria-hidden="true"><i style="background:#EF6A5E"></i><i style="background:#F5BD4F"></i><i style="background:#61C454"></i></div><pre><code style="all:unset">${hl(code)}</code></pre></div>`;

// ---------- memory diagrams (drawn from the slide geometry) ----------
const CMAP = { FFFFFF: "var(--bg)", "2A3363": "var(--primary)", "156DF2": "var(--accent)", F2F3F7: "var(--panel)", "5B6478": "var(--muted)", "24262B": "var(--fg)", "0F766E": "var(--teal)", D9DCE6: "var(--border)" };
const cm = (c, d) => CMAP[String(c || "").toUpperCase()] || d;
const isHe = s => /[֐-׿]/.test(s);
function splitCustom(items) {
  const captions = [], codes = [], draw = [];
  for (const it of items) {
    if (it.k === "code") codes.push(it);
    else if (it.k === "text" && isHe(it.text) && it.text.length > 26) captions.push(it);
    else if (it.k !== "badge") draw.push(it);
  }
  const hasShapes = draw.some(i => i.k === "shape");
  return { captions, codes, draw: hasShapes ? draw : [] };
}
function svgDiagram(items) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const grow = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  const out = [];
  for (const it of items) {
    const { x, y, w = 0, h = 0 } = it;
    if (it.k === "panel") { grow(x, y); grow(x + w, y + h); out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx=".08" fill="var(--panel)" stroke="var(--border)" stroke-width=".015"/>`); }
    else if (it.k === "shape" && it.type === "rect") { grow(x, y); grow(x + w, y + h); out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${cm(it.fill, "none")}" stroke="${cm(it.line, "none")}" stroke-width="${(it.lw || 1) / 72}"/>`); }
    else if (it.k === "shape" && it.type === "oval") { grow(x, y); grow(x + w, y + h); out.push(`<ellipse cx="${x + w / 2}" cy="${y + h / 2}" rx="${w / 2}" ry="${h / 2}" fill="${cm(it.fill, "var(--accent)")}"/>`); }
    else if (it.k === "shape" && it.type === "line") { grow(x, y); grow(x + w, y + h); out.push(`<line x1="${x}" y1="${y}" x2="${x + w}" y2="${y + h}" stroke="${cm(it.line, "var(--accent)")}" stroke-width="${(it.lw || 1.5) / 72}" ${it.arrow ? 'marker-end="url(#ah)"' : ""}/>`); }
    else if (it.k === "text") {
      const t = plain(it.text), fs = (it.size || 14) / 72;
      const anchor = it.align === "center" ? "middle" : it.align === "right" ? "end" : "start";
      const tx = it.align === "center" ? x + w / 2 : it.align === "right" ? x + w : x;
      const ty = it.valign === "middle" ? y + h / 2 : y + fs * 0.95;
      const est = t.length * fs * (it.font ? 0.6 : 0.5);
      grow(anchor === "start" ? tx : anchor === "end" ? tx - est : tx - est / 2, y);
      grow(anchor === "start" ? tx + est : anchor === "end" ? tx : tx + est / 2, ty + fs * .3);
      out.push(`<text x="${tx}" y="${ty}" text-anchor="${anchor}" ${it.valign === "middle" ? 'dominant-baseline="central"' : ""} font-size="${fs}" font-family="${it.font ? "var(--mono)" : "var(--sans)"}" font-weight="${it.bold ? 700 : 400}" fill="${cm(it.color, "var(--fg)")}">${esc(t)}</text>`);
    }
  }
  const p = 0.15, vw = x1 - x0 + 2 * p, vh = y1 - y0 + 2 * p;
  return `<svg viewBox="${x0 - p} ${y0 - p} ${vw} ${vh}" style="max-width:${Math.round(vw * 80)}px" role="img" aria-label="תרשים זיכרון">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>${out.join("")}</svg>`;
}

// ---------- line chart (from the slide's chart data) ----------
const CHART_COL = { "9AA0AE": "var(--muted)", "0F766E": "var(--teal)", "156DF2": "var(--accent)", "2A3363": "var(--primary)" };
function svgChart(c) {
  const W = 640, H = 340, L = 52, R = 16, T = 16, B = 44;
  const n = c.data[0].values.length, max = Math.max(...c.data.flatMap(d => d.values));
  const top = Math.ceil(max / 20) * 20, X = i => L + (W - L - R) * i / (n - 1), Y = v => T + (H - T - B) * (1 - v / top);
  const grid = [0, .25, .5, .75, 1].map(f => { const v = Math.round(top * f), y = Y(v);
    return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="${L - 8}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="12" fill="var(--muted)">${v}</text>`; }).join("");
  const xl = c.data[0].labels.map((l, i) => `<text x="${X(i)}" y="${H - B + 18}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(l)}</text>`).join("");
  const lines = c.data.map((d, k) => `<polyline fill="none" stroke="${CHART_COL[(c.colors || [])[k]] || "var(--accent)"}" stroke-width="3" stroke-linejoin="round" points="${d.values.map((v, i) => X(i) + "," + Y(v)).join(" ")}"/>`).join("");
  const ends = c.data.map((d, k) => `<text x="${W - R - 4}" y="${Y(d.values[n - 1]) - 8}" text-anchor="end" font-size="13" font-weight="700" fill="${CHART_COL[(c.colors || [])[k]] || "var(--accent)"}" font-family="var(--mono)">${esc(d.name)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.data.map(d => d.name).join(", "))}" style="max-width:${W}px">${grid}${xl}${lines}${ends}
    <text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle" font-size="13" fill="var(--fg)" font-family="var(--mono)">${esc(c.xTitle || "n")}</text></svg>`;
}

// ---------- downloads ----------
let dlCap = null;
if (window.claude && window.claude.use) window.claude.use("downloads").then(c => { dlCap = c; }).catch(() => {});
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2600); }
document.addEventListener("click", async e => {
  const a = e.target.closest("a.dl");
  if (!a || !dlCap) return;
  e.preventDefault();
  try {
    const blob = await (await fetch(a.getAttribute("href"))).blob();
    await dlCap.save({ filename: a.dataset.name, data: blob });
    toast("הקובץ נשמר");
  } catch (err) { if (err && err.code !== "declined") toast("לא ניתן לשמור את הקובץ כאן"); }
});
const FILE_LABEL = { "summary.pdf": ["תקציר השיעור", "PDF"], "slides.pdf": ["מצגת", "PDF"], "slides.pptx": ["מצגת", "PowerPoint"], "worksheet.pdf": ["דף עבודה", "PDF"], "worksheet.docx": ["דף עבודה", "Word"] };
function dlButtons(L) {

// ---------- lessons, units, search ----------
const LESSONS = DATA.lessons;
const UNIT = Object.fromEntries(DATA.units.map(u => [u.id, u]));
const byId = id => LESSONS.find(l => l.id === id);
const unitLessons = u => LESSONS.filter(l => l.unit === u);
const INDEX = [];
for (const L of LESSONS) {
  INDEX.push({ L, i: -1, title: L.title, text: [L.title, L.subtitle, L.build, L.blurb].join(" ") });
  (L.slides || []).forEach((s, i) => {
    if (!s.title || s.type === "title") return;
    const bits = [s.title, s.term, s.text, s.example, s.caption, s.big, s.intro, s.code,
      ...(s.points || []), ...((s.items || []).map(x => typeof x === "string" ? x : [x.head, x.text, x.code].join(" "))),
      ...((s.steps || []).map(x => x.head + " " + x.sub)), ...[s.left, s.right].filter(Boolean).flatMap(c => [c.head, ...c.items]),
      ...((s.rows || []).flat()), ...(s.head || [])];
    INDEX.push({ L, i, title: s.title, text: plain(bits.filter(Boolean).join(" ")) });
  });
  (L.steps4 || []).forEach((st, i) => INDEX.push({ L, i: "s" + i, title: st[0], text: st.join(" ") }));
}
function search(q) {
  q = q.trim().toLowerCase(); if (q.length < 2) return [];
  return INDEX.filter(e => e.text.toLowerCase().includes(q)).slice(0, 14).map(e => {
    const t = e.text, k = t.toLowerCase().indexOf(q), a = Math.max(0, k - 40);
    return { ...e, snip: (a ? "…" : "") + t.slice(a, k + q.length + 60) + "…" };
  });
}
const pdfLinks = l => l.files.map(f => `<a class="btn dl" href="${f.href}" data-name="${esc(f.name)}" ${DATA.static ? `download="${esc(f.name)}"` : 'target="_blank" rel="noopener"'}>${f.what || FILE_LABEL[f.kind][0]} <span class="ext">PDF</span></a>`).join("");

function tableHTML(s) {
  const cells = s.rows.flat(), empty = cells.filter(c => !String(c).trim()).length;
  if (empty > cells.length / 3) return null;           // a fill-in-the-blanks class activity: not useful on the web
  return `<div class="tablewrap"><table class="data"><thead><tr>${s.head.map(h => `<th>${md(h)}</th>`).join("")}</tr></thead>
    <tbody>${s.rows.map(r => `<tr>${r.map(c => `<td>${md(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function slideHTML(s, L, i) {
  const id = `s-${L.id}-${i}`, sec = s.section ? `<span class="sec">${esc(s.section)}</span>` : "";
  const head = `${sec}<h2>${md(s.title || "")}</h2>`;
  const ticket = /יציאה/.test(s.title || "");
  switch (s.type) {
    case "process": return `<section class="block" id="${id}">${head}<ol class="steps">${s.steps.map(st => `<li><span class="head">${esc(st.head)}</span><span class="muted">${md(st.sub)}</span></li>`).join("")}</ol>${s.caption ? `<p class="caption">${md(s.caption)}</p>` : ""}</section>`;
    case "definition": return `<section class="block" id="${id}">${sec}<div class="defcard"><span class="term">${md(s.term)}</span><p>${md(s.text)}</p>${s.example ? `<p class="ex">${md(s.example)}</p>` : ""}</div></section>`;
    case "code": return `<section class="block" id="${id}">${head}<div class="two"><ol class="points">${(s.points || []).map(p => `<li><span>${md(p)}</span></li>`).join("")}</ol>${codeCard(s.code)}</div></section>`;
    case "compare": return `<section class="block" id="${id}">${head}<div class="cols">${[s.left, s.right].map((c, k) => `<div class="tile ${k ? "now" : ""}"><h3>${md(c.head)}</h3><ul>${c.items.map(x => `<li>${md(x)}</li>`).join("")}</ul></div>`).join("")}</div></section>`;
    case "statement": return `<section class="block" id="${id}">${sec}<h2>${esc(ticket ? "שאלה לסיום השיעור" : s.title)}</h2><p class="statement">${md(s.big || "")}</p>${s.text ? `<p class="caption">${md(s.text)}</p>` : ""}</section>`;
    case "summary": return `<section class="block" id="${id}">${sec}<h2>${esc(s.title || "סיכום")}</h2><ol class="points">${s.items.map(x => `<li><span><b>${md(x.head)}.</b> ${md(x.text)}</span></li>`).join("")}</ol></section>`;
    case "table": { const t = tableHTML(s); return t ? `<section class="block" id="${id}">${head}${s.intro ? `<p class="caption">${md(s.intro)}</p>` : ""}${t}</section>` : ""; }
    case "cards":
      if (s.icon === "!") return "";                  // the worksheet-parts slide: the worksheet itself lives in Classroom
      return `<section class="block" id="${id}">${head}${s.intro ? `<p>${md(s.intro)}</p>` : ""}<div class="cols">${s.items.map(x => `<div class="tile"><h3>${md(x.head)}</h3><p>${md(x.text)}</p></div>`).join("")}</div></section>`;
    case "custom": {
      const chart = s.items.find(x => x.k === "chart");
      const { captions, codes, draw } = splitCustom(s.items);
      return `<section class="block" id="${id}">${sec}<h2>${esc(ticket ? "שאלה לסיום השיעור" : s.title)}</h2>
        ${ticket ? captions.map(c => `<p>${md(c.text)}</p>`).join("") : ""}
        ${chart ? `<div class="diagram">${svgChart(chart)}</div>` : ""}
        ${codes.length && !ticket && captions.length ? `<div class="two"><div class="caption-col">${captions.map(c => `<p>${md(c.text)}</p>`).join("")}</div>${codes.map(c => codeCard(c.code)).join("")}</div>` : codes.map(c => codeCard(c.code)).join("")}
        ${draw.length ? `<div class="diagram">${svgDiagram(draw)}</div>` : ""}
        ${ticket || (codes.length && captions.length) ? "" : captions.map(c => `<p class="caption">${md(c.text)}</p>`).join("")}</section>`;
    }
    default: return "";
  }
}

function lesson(lid) {
  const L = byId(lid);
  if (!L) return home();
  const U = UNIT[L.unit], sib = unitLessons(L.unit), k = LESSONS.indexOf(L);
  const prev = LESSONS[k - 1], next = LESSONS[k + 1];
  const body = L.slides ? L.slides.map((s, i) => slideHTML(s, L, i)).join("")
    : `<section class="block"><h2>איך עובדים</h2><p class="caption">${md(L.howto)}</p></section>
       <section class="block"><h2>שלבי התרגיל</h2><ol class="points">${L.steps4.map((st, i) => `<li id="s-${L.id}-s${i}"><span><b>${esc(st[0])}.</b> ${md(st[1])}</span></li>`).join("")}</ol></section>`;
  const toc = L.slides ? [...new Set(L.slides.map(s => s.section).filter(Boolean))].map(sec => {
    const i = L.slides.findIndex(s => s.section === sec);
    return `<a href="#lesson-${L.id}--${i}">${esc(sec)}</a>`;
  }).join("") : "";
  const own = DATA.bank.filter(q => q.lesson === L.id);
  const pick = L.mixQuiz ? shuffle(DATA.bank.filter(q => byId(q.lesson) && byId(q.lesson).unit === L.unit)).slice(0, 6) : own;
  return `
  <header class="lesson-head">
    <span class="eyebrow">${esc(U.title)} · שיעור ${L.n} מתוך ${sib.length}</span>
    <h1>${esc(L.title)}</h1>
    <p class="subtitle">${md(L.subtitle)}</p>
    <div class="dl-row">${pdfLinks(L)}${shareBtn("lesson-" + L.id)}</div>
    ${toc ? `<nav class="toc" aria-label="בשיעור הזה">${toc}${pick.length ? `<a href="#lesson-${L.id}--check">בדקו את עצמכם</a>` : ""}</nav>` : ""}
  </header>
  ${body}
  ${pick.length ? `<section class="block" id="s-${L.id}-check">
    <h2>בדקו את עצמכם</h2>
    <p class="muted">${L.mixQuiz ? "שש שאלות מכל היחידה, בסדר אקראי." : "שאלות קצרות על השיעור. לחצו על תשובה כדי לראות אם צדקתם ולמה."} <span class="score" id="score"></span></p>
    <div class="quiz">${pick.map(q => quizQ(q)).join("")}</div>
  </section>` : ""}
  <nav class="dl-row" style="padding-top:24px;border-top:1px solid var(--border)">
    ${prev ? `<a class="btn" href="#lesson-${prev.id}">→ ${esc(prev.title)}</a>` : ""}
    ${next ? `<a class="btn primary" href="#lesson-${next.id}">${esc(next.title)} ←</a>` : `<a class="btn primary" href="#practice">למחולל התרגול ←</a>`}
  </nav>`;
}

// ---------- self-check ----------
const KIND = { tf: "נכון או לא נכון", trace: "מעקב: מה הפלט?", mc: "בחירה מתוך אפשרויות", bug: "מה הבעיה?" };
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const optBtn = (q, v) => isHe(v) ? `<button class="opt he" data-v="${esc(v)}">${esc(v)}</button>` : `<button class="opt" data-v="${esc(v)}"><pre>${esc(v)}</pre></button>`;
function quizQ(q) {
  let opts = "";
  if (q.kind === "tf") opts = [true, false].map(v => `<button class="opt he" data-v="${v}">${v ? "נכון" : "לא נכון"}</button>`).join("");
  if (q.kind === "trace") opts = shuffle([q.answer, ...q.wrong]).map(v => optBtn(q, v)).join("");
  if (q.kind === "mc") opts = shuffle(q.options).map(v => optBtn(q, v)).join("");
  if (q.kind === "bug") opts = `<button class="opt he" data-v="reveal">הצגת ההסבר</button>`;
  return `<div class="q" data-id="${q.id}">
    <div class="qhead"><span class="kind">${KIND[q.kind]}</span><h3>${md(q.q)}</h3></div>
    ${q.code ? codeCard(q.code) : ""}
    <div class="opts" role="group">${opts}</div>
    <div class="feedback" hidden></div></div>`;
}
let tally = { right: 0, done: 0 };
document.addEventListener("click", e => {
  const b = e.target.closest("button.opt"); if (!b) return;
  const box = b.closest(".q"), q = DATA.bank.find(x => x.id === box.dataset.id), fb = $(".feedback", box);
  box.querySelectorAll("button.opt").forEach(x => (x.disabled = true));
  if (q.kind === "bug") { fb.innerHTML = `<p>${md(q.answer)}</p>`; fb.hidden = false; return; }
  const right = String(q.answer);
  const ok = right === b.dataset.v;
  b.classList.add(ok ? "right" : "wrong");
  if (!ok) box.querySelectorAll("button.opt").forEach(x => { if (x.dataset.v === right) x.classList.add("right"); });
  fb.className = "feedback " + (ok ? "good" : "miss");
  fb.innerHTML = `<span class="verdict">${ok ? "נכון!" : "לא בדיוק."}</span> ${md(q.why)}`;
  fb.hidden = false;
  tally.done++; if (ok) tally.right++;
  const sc = $("#score"); if (sc) sc.textContent = `${tally.right} מתוך ${tally.done} נכונות`;
});

// ---------- practice generator ----------
const WITH_Q = LESSONS.filter(l => DATA.bank.some(q => q.lesson === l.id));
const P = { lessons: new Set(WITH_Q.filter(l => l.unit === DATA.units[DATA.units.length - 1].id).map(l => l.id)), kinds: new Set(Object.keys(KIND)), count: 6, answers: false, seed: [] };
function practice() {
  return `
  <header class="lesson-head">
    <span class="eyebrow">מבני נתונים · תרגול</span>
    <h1>מחולל דפי תרגול</h1>
    <p class="subtitle">בוחרים שיעורים וסוגי שאלות, ומקבלים דף חדש. אפשר לפתור על המסך או להוריד ולהדפיס.</p>
    ${DATA.siteUrl ? `<div class="dl-row">${shareBtn("practice")}</div>` : ""}
  </header>
  <form class="controls" id="pform">
    ${DATA.units.map(u => { const ls = WITH_Q.filter(l => l.unit === u.id); return ls.length ? `<fieldset><legend>${esc(u.title)}</legend>
      ${ls.map(l => `<label class="chk"><input type="checkbox" id="pl-${l.id}" name="lesson" value="${l.id}" ${P.lessons.has(l.id) ? "checked" : ""}> ${l.n}. ${esc(l.title)}</label>`).join("")}
    </fieldset>` : ""; }).join("")}
    <fieldset><legend>סוגי שאלות</legend>
      ${Object.entries(KIND).map(([k, v]) => `<label class="chk"><input type="checkbox" id="pk-${k}" name="kind" value="${k}" ${P.kinds.has(k) ? "checked" : ""}> ${v}</label>`).join("")}
    </fieldset>
    <fieldset><legend>הדף</legend>
      <label class="chk">מספר שאלות <select id="pcount">${[4, 6, 8, 10, 12].map(n => `<option ${n === P.count ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      <label class="chk"><input type="checkbox" id="pans" ${P.answers ? "checked" : ""}> הצגת פתרונות</label>
    </fieldset>
    <div class="dl-row"><button class="btn primary" type="submit">דף חדש</button><button class="btn" type="button" id="pdl">הורדת הדף להדפסה <span class="ext">HTML</span></button></div>
  </form>
  <div id="sheet" class="sheet"></div>`;
}
const inPool = q => P.lessons.has(q.lesson) && P.kinds.has(q.kind);
function pool() { return DATA.bank.filter(inPool); }
function newSheet() { P.seed = shuffle(pool()).slice(0, P.count).map(q => q.id); }
function sheetQs() { return P.seed.map(id => DATA.bank.find(q => q.id === id)).filter(inPool); }
function ansHTML(q) {
  if (q.kind === "tf") return `<b>${q.answer ? "נכון" : "לא נכון"}.</b> ${md(q.why)}`;
  if (q.kind === "trace") return `<pre>${esc(q.answer)}</pre><p>${md(q.why)}</p>`;
  if (q.kind === "mc") return `<b>${md(q.answer)}.</b> ${md(q.why)}`;
  return md(q.answer);
}
function sheetHTML(withAns) {
  const qs = sheetQs();
  if (!qs.length) return `<p class="muted">אין שאלות שמתאימות לבחירה. סמנו לפחות שיעור אחד וסוג שאלה אחד.</p>`;
  return qs.map((q, i) => `<div class="sq"><h3><span>${i + 1}.</span><span>${md(q.q)}</span></h3>
    ${q.code ? codeCard(q.code) : ""}
    ${q.kind === "mc" && !withAns ? `<p class="muted">${q.options.map(o => esc(o)).join(" · ")}</p>` : ""}
    ${withAns ? `<div class="ans">${ansHTML(q)}</div>` : `<div class="lines" aria-hidden="true"></div>`}</div>`).join("");
}
function renderSheet() {
  $("#sheet").innerHTML = sheetHTML(P.answers);
  const n = sheetQs().length, avail = pool().length;
  if (n < P.count && avail > n) { newSheet(); $("#sheet").innerHTML = sheetHTML(P.answers); }
}
function bindPractice() {
  const f = $("#pform");
  if (!P.seed.length) newSheet();
  renderSheet();
  f.addEventListener("change", e => {
    P.lessons = new Set([...f.querySelectorAll("input[name=lesson]:checked")].map(x => x.value));
    P.kinds = new Set([...f.querySelectorAll("input[name=kind]:checked")].map(x => x.value));
    const c = +$("#pcount").value; const changed = c !== P.count || e.target.name;
    P.count = c; P.answers = $("#pans").checked;
    if (changed) newSheet();
    renderSheet();
  });
  f.addEventListener("submit", e => { e.preventDefault(); newSheet(); renderSheet(); });
  $("#pdl").addEventListener("click", async () => {
    const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");
    const html = `<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>דף תרגול · מבני נתונים</title><style>${css}
      body{padding:24px} .lines{height:90px} @media print{body{padding:0} .sq{break-inside:avoid}}</style></head><body><div class="wrap" style="padding-block:0">
      <p class="eyebrow">מדעי המחשב | כיתה יא' | מבני נתונים</p><h1 style="font-size:1.7rem">דף תרגול</h1>
      <p class="muted">שם: ____________________ &nbsp; תאריך: ____________</p>
      <div class="sheet">${sheetHTML(false)}</div>
      <h2 style="page-break-before:always;margin-top:32px">פתרונות</h2><div class="sheet">${sheetHTML(true)}</div></div></body></html>`;
    if (dlCap) {
      try { await dlCap.save({ filename: "דף תרגול - מבני נתונים.html", data: html }); toast("הדף נשמר"); }
      catch (err) { if (err && err.code !== "declined") toast("לא ניתן לשמור את הקובץ כאן"); }
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      a.download = "practice-sheet.html"; document.body.appendChild(a); a.click(); a.remove();
    }
  });
}

// ---------- router ----------
const OLD_IDS = { 1: "co1", 2: "co2", 3: "co3", 4: "co4" };   // links shared before the site had several units
function route() {
  const h = location.hash.replace(/^#/, "");
  const app = $("#app");
  tally = { right: 0, done: 0 };
  let m;
  $("#nav-home").removeAttribute("aria-current"); $("#nav-practice").removeAttribute("aria-current");
  if (h === "practice") { app.innerHTML = practice(); bindPractice(); $("#nav-practice").setAttribute("aria-current", "page"); window.scrollTo(0, 0); document.title = "מחולל תרגול · מבני נתונים"; }
  else if ((m = h.match(/^lesson-([a-z]*\d+)(?:--(\w+))?$/))) {
    const lid = OLD_IDS[m[1]] || m[1];
    app.innerHTML = lesson(lid);
    const target = m[2] && document.getElementById(`s-${lid}-${m[2]}`);
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
    const L = byId(lid); document.title = (L ? L.title + " · " : "") + "מבני נתונים";
  } else {
    app.innerHTML = home(); $("#nav-home").setAttribute("aria-current", "page"); document.title = "מבני נתונים · כיתה יא'";
    const q = $("#q");
    q.addEventListener("input", () => {
      const r = search(q.value);
      $("#results").innerHTML = q.value.trim().length < 2 ? "" : r.length ? r.map(e =>
        `<a href="#lesson-${e.L.id}${e.i === -1 ? "" : "--" + e.i}"><div class="r-title">${esc(e.title)} <span class="muted" style="font-weight:400">· ${esc(UNIT[e.L.unit].title)}, שיעור ${e.L.n}</span></div><div class="r-snip">${esc(e.snip)}</div></a>`).join("")
        : `<p class="muted">לא נמצא דבר עבור "${esc(q.value)}". נסו מילה אחרת, למשל מערך או מחסנית.</p>`;
    });
  }
}
window.addEventListener("hashchange", route);
route();

})();
</script>
